<meta charset="utf-8">
<title>Centaurian Sternenhimmel</title>

<meta name="robots" content="noindex, indexifembedded">
<meta name="description" content="Interaktive Sternkarte live: echte Sterne in Teleskop-Farben, Sternbilder, Planeten, Mond und Milchstraße für deinen Ort. Handy in den Himmel halten, Objekte antippen und mehr erfahren.">
<style>
/* Vollbild-Himmel wie in Sternen-Apps: nur vier runde Knöpfe in den Ecken,
   alles andere klappt bei Bedarf auf */
:root {
  --night: #06082a;
  --ink: #eef0ff;
  --muted: #9aa3c8;
  --glass: rgba(14, 18, 60, 0.62);
  --line: rgba(170, 185, 255, 0.22);
  --accent: #ff5a4d;
  --font-sans: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --font-display: var(--font-sans);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#skygl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#sky.drag { cursor: grabbing; }
.round { position: fixed; z-index: 4; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); color: var(--ink); cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 0; }
.round svg { width: 24px; height: 24px; }
.round[aria-pressed="true"] { border-color: rgba(255, 90, 77, 0.8); box-shadow: 0 0 0 1px rgba(255, 90, 77, 0.4), 0 0 14px rgba(255, 90, 77, 0.35); }
.round:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#tSensor { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; }
#timeBtn { top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; }
#searchBtn { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; }
#menuBtn { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: 16px; }
.pill { position: fixed; z-index: 3; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 140px); padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: pointer; }
.pill b { color: var(--ink); font-weight: 500; }
.pill #dir { color: var(--accent); font-weight: 600; margin-right: 6px; }
.sheet { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 12px; }
.sheet[hidden] { display: none; }
#timeSheet { top: calc(70px + env(safe-area-inset-top, 0px)); }
#menuSheet, #searchSheet { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
button.chip, a.chip { text-decoration: none; display: inline-block;
 }
button.chip, a.chip { font: 500 13px/1 var(--font-sans); color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; cursor: pointer; }
button.chip[aria-pressed="true"] { color: var(--ink); border-color: rgba(255, 90, 77, 0.7); background: rgba(255, 90, 77, 0.12); }
.time { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.time input[type=range] { flex-basis: 100%; accent-color: var(--accent); }
.time button { font: 500 13px var(--font-sans); color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
.time button:hover, button.chip:hover { color: var(--ink); }
#locSheet { top: calc(70px + env(safe-area-inset-top, 0px)); }
#locSheet input, #searchSheet input { width: 100%; box-sizing: border-box; font: 400 16px var(--font-sans); color: var(--ink); background: rgba(0,0,20,0.4); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
#results, #locResults { list-style: none; margin: 8px 0 0; padding: 0; max-height: 40vh; overflow-y: auto; }
#results li button, #locResults li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; font: 400 15px var(--font-sans); color: var(--ink); background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
#results li button:hover, #results li button:focus-visible, #locResults li button:hover, #locResults li button:focus-visible { background: rgba(255,255,255,0.07); }
#results li span, #locResults li span { color: var(--muted); font-size: 12px; }
@media (min-width: 760px) { #info { left: 16px !important; right: auto !important; margin: 0 !important; width: 360px; } }
#info { position: fixed; z-index: 3; max-height: calc(100vh - 160px); overflow-y: auto; box-sizing: border-box; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: 380px; margin: 0 auto; padding: 14px 16px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#info h2 { font-size: 24px; font-weight: 500; margin: 2px 0 8px; text-wrap: balance; }
#info .kind { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
#info dt { color: var(--muted); }
#info dd { margin: 0; }
#infoNote { margin: 10px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink); opacity: 0.9; }
#info .close { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid var(--line); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; z-index: 2; }
#info .close:hover { border-color: var(--accent); color: var(--accent); }
/* Wissen aus Wikipedia (Nutzerwunsch 03.10.2026: viele kurze Infos beim Antippen) */
#infoWiki { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
#infoWiki .wh { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
#wikiText p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: var(--ink); opacity: 0.92; }
#wikiText.clamp { max-height: 10.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 65%, transparent); mask-image: linear-gradient(#000 65%, transparent); }
#wikiMore { margin: 2px 0 6px; padding: 5px 12px; font-size: 12px; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
#infoWiki .wf { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 12px; }
#wikiLink { color: var(--accent); text-decoration: none; }
#wikiSrc { color: var(--muted); font-size: 11px; }
#horizonBtn { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); top: calc(104px + env(safe-area-inset-top, 0px)); font: 500 13px/1 var(--font-sans); color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#horizonBtn[hidden] { display: none; }
#sensorMsg { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); font-size: 13px; color: var(--ink); background: rgba(255, 90, 77, 0.25); border: 1px solid rgba(255, 90, 77, 0.5); border-radius: 10px; padding: 6px 12px; max-width: calc(100% - 40px); text-align: center; }
#dirDeg { display: none; }
.note { margin: 8px 2px 0; font-size: 12px; color: var(--muted); }
.note:empty { display: none; }

/* HUD-Design wie auf der Website (Nutzerwunsch 02.10.2026): dunkleres Glas,
   kantigere Formen, rote Ecken an Karten und Menüs */
:root { --glass: rgba(10, 12, 26, 0.6); --line: rgba(210, 222, 255, 0.14); --hudc: rgba(255, 90, 77, 0.85); }
.sheet, #info { border-radius: 6px !important; box-shadow: 0 20px 60px -30px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05); }
.sheet::after, #info::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background:
    linear-gradient(var(--hudc), var(--hudc)) 0 0 / 14px 1px no-repeat, linear-gradient(var(--hudc), var(--hudc)) 0 0 / 1px 14px no-repeat,
    linear-gradient(var(--hudc), var(--hudc)) 100% 0 / 14px 1px no-repeat, linear-gradient(var(--hudc), var(--hudc)) 100% 0 / 1px 14px no-repeat,
    linear-gradient(var(--hudc), var(--hudc)) 0 100% / 14px 1px no-repeat, linear-gradient(var(--hudc), var(--hudc)) 0 100% / 1px 14px no-repeat,
    linear-gradient(var(--hudc), var(--hudc)) 100% 100% / 14px 1px no-repeat, linear-gradient(var(--hudc), var(--hudc)) 100% 100% / 1px 14px no-repeat;
}
.round { box-shadow: 0 0 0 3px rgba(10, 12, 26, 0.35), 0 0 18px -6px rgba(255, 90, 77, 0.55); }
.round:hover, .round[aria-pressed="true"] { border-color: rgba(255, 90, 77, 0.7); }
.pill { border-radius: 6px !important; }
button.chip, a.chip { border-radius: 4px !important; letter-spacing: 0.04em; }
button.chip[aria-pressed="true"] { box-shadow: 0 0 14px -5px rgba(255, 90, 77, 0.8); }
#info .kind, #infoKind { letter-spacing: 0.2em; }
</style>

// ---------------- Zeichnen ----------------
const tmpV = [0, 0, 0], P = { x: 0, y: 0, z: 0 };
const visStars = [];
const labelHits = []; // Beschriftungen zum Antippen: {x0,y0,x1,y1,hit}
let bodies = []; // Sonne, Mond, Planeten des aktuellen Bildes
const DIRS = TX.dirs;

function simJd() { return jdNow() + S.dayOffset + S.offsetMin / 1440; }

function computeBodies(jd) {
  const earth = helio("earth", jd);
  const list = [];
  const sunEq = eclToRaDec(-earth[0], -earth[1], -earth[2]);
  list.push({ id: "sun", name: tr("p_sun"), kind: tr("star"), ra: sunEq.ra, dec: sunEq.dec, distKm: sunEq.r * KM_PER_AU, color: "#fff4d6", mag: -26.7, radiusDeg: 0.267 });
  const m = moonPos(jd);
  list.push({ id: "moon", name: tr("moon"), kind: tr("moon"), ra: m.ra, dec: m.dec, distKm: m.distKm, color: "#e8e4da", mag: -12, radiusDeg: 0.259 });
  for (const id of Object.keys(PLANET_INFO)) {
    const p = helio(id, jd);
    const q = eclToRaDec(p[0] - earth[0], p[1] - earth[1], p[2] - earth[2]);
    // cos des Phasenwinkels (Sonne–Planet–Erde) für die beleuchtete Seite
    const ex = earth[0] - p[0], ey = earth[1] - p[1], ez = earth[2] - p[2];
    const cosA = -(p[0] * ex + p[1] * ey + p[2] * ez) / (Math.hypot(p[0], p[1], p[2]) * Math.hypot(ex, ey, ez));
    list.push({ id, name: tr("p_" + id), kind: tr("planet"), ra: q.ra, dec: q.dec, distKm: q.r * KM_PER_AU, color: PLANET_INFO[id].color, mag: PLANET_INFO[id].mag, radiusDeg: 0, cosA });
  }
  for (const id of Object.keys(DWARF_INFO)) {
    const p = helio(id, jd);
    const q = eclToRaDec(p[0] - earth[0], p[1] - earth[1], p[2] - earth[2]);
    const mag = DWARF_INFO[id].H + 5 * Math.log10(Math.hypot(p[0], p[1], p[2]) * q.r);
    list.push({ id, name: tr("p_" + id), kind: tr("dwarfPlanet"), dwarf: true, ra: q.ra, dec: q.dec, distKm: q.r * KM_PER_AU, color: DWARF_INFO[id].color, mag, radiusDeg: 0 });
  }
  for (const b of list) { b.sd = Math.sin(b.dec); b.cd = Math.cos(b.dec); }

}

function draw() {
  const jd = simJd();

  bodies = computeBodies(jd);
  for (const b of bodies) { b.v = eqToEnu(b.ra, b.sd, b.cd, [0, 0, 0]); b.alt = Math.asin(b.v[2]); }
  const sun = bodies[0], moon = bodies[1];
  const sunAlt = sun.alt / DEG;
  // Helligkeit des Himmels: Tag → Dämmerung → Nacht
  const day = S.atmo ? Math.min(1, Math.max(0, (sunAlt + 12) / 16)) : 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  }

    const sv = eqToEnu(sun.ra, sun.sd, sun.cd, tmpV);
    const sa = vecToAltAz(sv);
    if (project(enu(sa.az, 0), P)) {
      const t = 1 - Math.abs(sunAlt + 3) / 15;
      const g2 = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, Math.max(W, H) * 0.7);
      g2.addColorStop(0, `rgba(255,140,70,${0.45 * t})`); g2.addColorStop(0.4, `rgba(255,100,80,${0.12 * t})`); g2.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

  }

  const nightLimit = Math.min(10, 5.8 + 1.7 * Math.log2(70 * DEG / S.fov + 1) - (W * H < 600000 ? 0.4 : 0)); // Handy: etwas weniger, damit es flüssig bleibt

  const dayK = S.atmo ? day : 0;
  const magLimit = dayK > 0 ? nightLimit + (1.1 - nightLimit) * Math.sqrt(dayK) : nightLimit;
  const starA = 1 - 0.3 * dayK; // Sterne selbst bleiben am Tag sichtbar, Linien/Milchstraße nicht

  ctx.globalCompositeOperation = "lighter";
  // Milchstraße
  if (!glSky && starFade > 0.05 && S.showMW) drawMilkyWay(false, starFade * 0.27);
  if (S.showFig && starFade > 0.05) drawFigures(starFade, frameDt);
  if (S.showDSO && starFade > 0.05) drawDSOs(starFade);
  // Ekliptik: scheinbare Bahn von Sonne und Planeten
  ctx.globalCompositeOperation = "source-over";
  if (S.showConst && starFade > 0.05) {
    ctx.save();
    ctx.setLineDash([7, 7]); ctx.strokeStyle = `rgba(232,180,96,${0.55 * starFade})`; ctx.lineWidth = 1.4;

    for (let l = 0; l <= 360; l += 2) {
      const L = l * DEG, ra = Math.atan2(Math.sin(L) * Math.cos(OBL), Math.cos(L)), dec = Math.asin(Math.sin(L) * Math.sin(OBL));

      const ok = project(v, P) && P.z > -0.3 && (!S.atmo || v[2] > -0.02);

    }
    ctx.stroke(); ctx.restore();
  }

  // Nutzerwunsch 03.10.2026: Linien nur beim Sternbild, auf das die Kamera
  // schaut (oder knapp daneben), weich ein-/ausgeblendet; feiner, mit Glanz.
  if (S.showConst && starFade > 0.05) {
    updateConstFocus();
    const gap = 6; // Lücke um die Sterne wie bei Stellarium

  const rCorner = Math.hypot(W, H) / 2 / cam.scale, zMin = Math.cos(Math.min(Math.PI, 2 * Math.atan(rCorner / 2) + 0.03));

    let r = 0.9 + Math.pow(b, 1.7) * 5.2 * Math.min(1.6, Math.sqrt(70 * DEG / S.fov));
    let a = Math.min(1, 0.16 + b * 1.35) * Math.max(starFade, starA * Math.min(1, dayK * 4));
    if (under) a *= 0.38; // „durch das Wasser“ gesehen
    else if (S.atmo) {

      const k = Math.min(0.55, 0.06 + 0.05 * (airX - 1));
      const ph = i * 12.9898;
      a *= 1 - k * (0.5 + 0.5 * Math.sin(tw * (4 + (i % 7)) + ph) * Math.sin(tw * (2.3 + (i % 5) * 0.7) + ph * 0.5));

    if (!s.c2) { const sat = Math.min(1, Math.max(0.72, (7 - s.mag) / 4.5)); s.c2 = s.col.map((v) => Math.round(255 + (v - 255) * sat)); s.css = `rgb(${s.c2[0]},${s.c2[1]},${s.c2[2]})`; }

    } else if (b.id === "moon") {

  // Beschriftungen
  labelHits.length = 0;
  const rects = [];
  const free = (x, y, w, h) => { for (const q of rects) if (x < q[2] && x + w > q[0] && y < q[3] && y + h > q[1]) return false; rects.push([x, y, x + w, y + h]); return true; };

let last = performance.now();
let frameDt = 16;
function frame(now) {

    if (t >= 1) anim = null;
  } else if (S.sensor && sensorAz !== null) {
    S.az += wrap(sensorAz - S.az) * 0.2; S.alt += (sensorAlt - S.alt) * 0.2; clampAlt();

}

  const stop = () => fade(0, () => audio.pause());
  // Handys zählen nur pointerup/touchend/click als „Nutzer-Aktion“ (nicht pointerdown) →
  // bei jeder dieser Aktionen versuchen, bis die Musik wirklich läuft
  const EV = ["pointerup", "touchend", "click", "keydown", "mousedown"];
  const first = () => {
    if (started || !on) return;
    if (audio.paused) play();
    if (started) EV.forEach((t) => window.removeEventListener(t, first, true));
  };
  EV.forEach((t) => window.addEventListener(t, first, true));
  // sofort versuchen (klappt, wenn vorher auf der Website geklickt wurde); sonst beim ersten Antippen
  if (on) play().then(() => { if (started) EV.forEach((t) => window.removeEventListener(t, first, true)); });
  // Seite verlassen → Musik der Hauptseite stoppen
  window.addEventListener("pagehide", () => { try { audio.pause(); audio.removeAttribute("src"); audio.load(); } catch {} });
  btn.onclick = () => {
    on = !on; btn.setAttribute("aria-pressed", String(on));
    try { localStorage.setItem("sky-music", on ? "on" : "off"); } catch {}
    on ? play() : stop();
  };
  // Tab im Hintergrund → Musik pausieren
  document.addEventListener("visibilitychange", () => { if (document.hidden) audio.pause(); else if (on && audio.volume > 0) audio.play().catch(() => {}); });
})();

requestAnimationFrame(frame);
</script>
