<!doctype html>
<meta charset="utf-8">
<title>Centaurian Sternenhimmel</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Vollbild-Himmel wie in Sternen-Apps: nur vier runde Knöpfe in den Ecken,
   alles andere klappt bei Bedarf auf */
:root {
  --night: #06082a;
  --ink: #eef0ff;
  --muted: #9aa3c8;
  --glass: rgba(14, 18, 60, 0.62);
  --line: rgba(170, 185, 255, 0.22);
  --accent: #ff5a4d;
  --font-sans: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --font-display: var(--font-sans);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#skygl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#sky.drag { cursor: grabbing; }
.round { position: fixed; z-index: 4; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); color: var(--ink); cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 0; }
.round svg { width: 24px; height: 24px; }
.round[aria-pressed="true"] { border-color: rgba(255, 90, 77, 0.8); box-shadow: 0 0 0 1px rgba(255, 90, 77, 0.4), 0 0 14px rgba(255, 90, 77, 0.35); }
.round:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#tSensor { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; }
#timeBtn { top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; }
#searchBtn { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; }
#menuBtn { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: 16px; }
.pill { position: fixed; z-index: 3; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 140px); padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: pointer; }
.pill b { color: var(--ink); font-weight: 500; }
.pill #dir { color: var(--accent); font-weight: 600; margin-right: 6px; }
.sheet { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 12px; }
.sheet[hidden] { display: none; }
#timeSheet { top: calc(70px + env(safe-area-inset-top, 0px)); }
#menuSheet, #searchSheet { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
button.chip, a.chip { text-decoration: none; display: inline-block;
 }
button.chip, a.chip { font: 500 13px/1 var(--font-sans); color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; cursor: pointer; }
button.chip[aria-pressed="true"] { color: var(--ink); border-color: rgba(255, 90, 77, 0.7); background: rgba(255, 90, 77, 0.12); }
.time { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.time input[type=range] { flex-basis: 100%; accent-color: var(--accent); }
.time button { font: 500 13px var(--font-sans); color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
.time button:hover, button.chip:hover { color: var(--ink); }
#locSheet { top: calc(70px + env(safe-area-inset-top, 0px)); }
#locSheet input, #searchSheet input { width: 100%; box-sizing: border-box; font: 400 16px var(--font-sans); color: var(--ink); background: rgba(0,0,20,0.4); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
#results, #locResults { list-style: none; margin: 8px 0 0; padding: 0; max-height: 40vh; overflow-y: auto; }
#results li button, #locResults li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; font: 400 15px var(--font-sans); color: var(--ink); background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
#results li button:hover, #results li button:focus-visible, #locResults li button:hover, #locResults li button:focus-visible { background: rgba(255,255,255,0.07); }
#results li span, #locResults li span { color: var(--muted); font-size: 12px; }
#info { position: fixed; z-index: 3; max-height: calc(100vh - 160px); overflow-y: auto; box-sizing: border-box; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: 380px; margin: 0 auto; padding: 14px 16px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#info h2 { font-size: 24px; font-weight: 500; margin: 2px 0 8px; text-wrap: balance; }
#info .kind { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
#info dt { color: var(--muted); }
#info dd { margin: 0; }
#infoNote { margin: 10px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink); opacity: 0.9; }
#info .close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
#sensorMsg { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); font-size: 13px; color: var(--ink); background: rgba(255, 90, 77, 0.25); border: 1px solid rgba(255, 90, 77, 0.5); border-radius: 10px; padding: 6px 12px; max-width: calc(100% - 40px); text-align: center; }
#dirDeg { display: none; }
.note { margin: 8px 2px 0; font-size: 12px; color: var(--muted); }
.note:empty { display: none; }
</style>

<canvas id="skygl" aria-hidden="true"></canvas>
<canvas id="sky" data-i18n-aria="skyAria" aria-label="Interaktiver Sternenhimmel"></canvas>

<button class="round" id="tSensor" aria-pressed="false" data-i18n-aria="sensor" data-i18n-title="sensor" aria-label="Handy in den Himmel halten" title="Handy in den Himmel halten">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><g id="needle"><path d="M12 4 L14.2 12 L12 20 L9.8 12 Z" fill="none"/><path d="M12 4 L14.2 12 L9.8 12 Z" fill="#ff5a4d" stroke="#ff5a4d"/></g></svg>
</button>
<div class="pill" id="pill" role="button" tabindex="0" data-i18n-aria="changePlace" aria-label="Ort ändern" title="Ort ändern"><span id="dir">S</span><b id="place">…</b> <span aria-hidden="true">▾</span> · <span id="clock"></span><span id="dirDeg"></span></div>
<button class="round" id="timeBtn" aria-pressed="false" data-i18n-aria="time" data-i18n-title="time" aria-label="Zeit" title="Zeit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2.5"/></svg>
</button>
<button class="round" id="searchBtn" aria-pressed="false" data-i18n-aria="search" data-i18n-title="search" aria-label="Suchen" title="Suchen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
</button>
<button class="round" id="menuBtn" aria-pressed="false" data-i18n-aria="settings" data-i18n-title="settings" aria-label="Einstellungen" title="Einstellungen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>

<div id="sensorMsg" hidden></div>

<div class="sheet" id="timeSheet" hidden>
  <div class="time">
    <input id="scrub" type="range" min="-720" max="720" step="5" value="0" data-i18n-aria="scrub" aria-label="Zeit verschieben (±12 Stunden)">
    <button id="dayMinus">−1 <span data-i18n="day">Tag</span></button>
    <button id="hourMinus">−1 h</button>
    <button id="now" data-i18n="now">Jetzt</button>
    <button id="night" data-i18n="tonight">Heute 22 Uhr</button>
    <button id="hourPlus">+1 h</button>
    <button id="dayPlus">+1 <span data-i18n="day">Tag</span></button>
  </div>
</div>

<div class="sheet" id="menuSheet" hidden>
  <div class="row">
    <button class="chip" id="tConst" aria-pressed="true" data-i18n="constellations">Sternbilder</button>
    <button class="chip" id="tNames" aria-pressed="true" data-i18n="starNames">Sternnamen</button>
    <button class="chip" id="tMW" aria-pressed="true" data-i18n="milkyWay">Milchstraße</button>
    <button class="chip" id="tAtmo" aria-pressed="true" data-i18n="horizon">Horizont & Wasser</button>
    <a class="chip" id="backLink" href="/universum" target="_top" data-i18n="back">← Zurück zum Universum</a>
  </div>
</div>

<div class="sheet" id="locSheet" hidden>
  <button class="chip" id="tLoc" aria-pressed="false" style="width:100%;margin-bottom:8px" data-i18n="gps">📍 Meinen Standort verwenden (GPS)</button>
  <input id="locQ" type="search" data-i18n-ph="placeQ" placeholder="Stadt oder Region suchen …" autocomplete="off" data-i18n-aria="changePlace" aria-label="Ort suchen">
  <ul id="locResults" class="results"></ul>
  <p id="locNote" class="note"></p>
</div>

<div class="sheet" id="searchSheet" hidden>
  <input id="q" type="search" data-i18n-ph="searchQ" placeholder="Stern, Planet oder Sternbild …" autocomplete="off" data-i18n-aria="search" aria-label="Suchen">
  <ul id="results" class="results"></ul>
</div>

<div id="info" hidden>
  <button class="close" id="infoClose" data-i18n-aria="close" aria-label="Schließen">×</button>
  <div class="kind" id="infoKind"></div>
  <h2 id="infoName"></h2>
  <dl id="infoList"></dl>
  <p id="infoNote" hidden></p>
</div>

const dustSprite = (() => {

function drawMilkyWay(mirror, k) {

    else if (S.atmo && tmpV[2] < -0.03) continue;

// ---------------- Zeichnen ----------------
const tmpV = [0, 0, 0], P = { x: 0, y: 0, z: 0 };
let bodies = []; // Sonne, Mond, Planeten des aktuellen Bildes
const DIRS = TX.dirs;

function simJd() { return jdNow() + S.dayOffset + S.offsetMin / 1440; }

function computeBodies(jd) {
  const earth = helio("earth", jd);
  const list = [];
  const sunEq = eclToRaDec(-earth[0], -earth[1], -earth[2]);
  list.push({ id: "sun", name: tr("p_sun"), kind: tr("star"), ra: sunEq.ra, dec: sunEq.dec, distKm: sunEq.r * KM_PER_AU, color: "#fff4d6", mag: -26.7, radiusDeg: 0.267 });
  const m = moonPos(jd);
  list.push({ id: "moon", name: tr("moon"), kind: tr("moon"), ra: m.ra, dec: m.dec, distKm: m.distKm, color: "#e8e4da", mag: -12, radiusDeg: 0.259 });
  for (const id of Object.keys(PLANET_INFO)) {
    const p = helio(id, jd);
    const q = eclToRaDec(p[0] - earth[0], p[1] - earth[1], p[2] - earth[2]);
    list.push({ id, name: tr("p_" + id), kind: tr("planet"), ra: q.ra, dec: q.dec, distKm: q.r * KM_PER_AU, color: PLANET_INFO[id].color, mag: PLANET_INFO[id].mag, radiusDeg: 0 });
  }
  for (const b of list) { b.sd = Math.sin(b.dec); b.cd = Math.cos(b.dec); }
  return list;
}

function draw() {
  const jd = simJd();
  LST = (gmstDeg(jd) + S.lon) * DEG; SL = Math.sin(S.lat * DEG); CL = Math.cos(S.lat * DEG);
  setupCamera();
  bodies = computeBodies(jd);
  for (const b of bodies) { b.v = eqToEnu(b.ra, b.sd, b.cd, [0, 0, 0]); b.alt = Math.asin(b.v[2]); }
  const sun = bodies[0], moon = bodies[1];
  const sunAlt = sun.alt / DEG;
  // Helligkeit des Himmels: Tag → Dämmerung → Nacht
  const day = S.atmo ? Math.min(1, Math.max(0, (sunAlt + 12) / 16)) : 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = mix([6, 8, 40], [38, 98, 178], day), hor = mix([26, 34, 104], [140, 185, 230], day);
  // Himmel: Verlauf zum Horizont, Dämmerungsglühen auf der Sonnenseite
  const water = mix([16, 22, 74], [70, 110, 165], day);
  if (glSky) {
    // Himmel, Milchstraße und Wasser zeichnet die Grafikkarte darunter
    glSky.render(day, S.atmo ? Math.pow(1 - day, 2) : 1, top, hor, water);
    ctx.clearRect(0, 0, W, H);
  } else {
    const hp = projectAltAz(S.az, 0);
    const gy = hp ? hp.y : H;
    const grad = ctx.createLinearGradient(0, Math.min(gy, H) - H, 0, Math.max(gy, 0));
    grad.addColorStop(0, rgb(top)); grad.addColorStop(1, rgb(hor));
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  }
  if (S.atmo && sunAlt > -18 && sunAlt < 8) {
    const sv = eqToEnu(sun.ra, sun.sd, sun.cd, tmpV);
    const sa = vecToAltAz(sv);
    if (project(enu(sa.az, 0), P)) {
      const t = 1 - Math.abs(sunAlt + 3) / 15;
      const g2 = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, Math.max(W, H) * 0.7);
      g2.addColorStop(0, `rgba(255,140,70,${0.45 * t})`); g2.addColorStop(0.4, `rgba(255,100,80,${0.12 * t})`); g2.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    }
  }
  const starFade = S.atmo ? Math.pow(1 - day, 2) : 1;
  const magLimit = Math.min(6.2, 4.6 + 1.6 * Math.log2(70 * DEG / S.fov + 1));

  ctx.globalCompositeOperation = "lighter";
  // Milchstraße
  if (!glSky && starFade > 0.05 && S.showMW) drawMilkyWay(false, starFade * 0.27);
  // Ekliptik: scheinbare Bahn von Sonne und Planeten
  ctx.globalCompositeOperation = "source-over";
  if (S.showConst && starFade > 0.05) {
    ctx.save();
    ctx.setLineDash([7, 7]); ctx.strokeStyle = `rgba(232,180,96,${0.55 * starFade})`; ctx.lineWidth = 1.4;
    ctx.beginPath(); let prev = false;
    for (let l = 0; l <= 360; l += 2) {
      const L = l * DEG, ra = Math.atan2(Math.sin(L) * Math.cos(OBL), Math.cos(L)), dec = Math.asin(Math.sin(L) * Math.sin(OBL));
      const v = eqToEnu(ra, Math.sin(dec), Math.cos(dec), tmpV);
      const ok = project(v, P) && P.z > -0.3 && (!S.atmo || v[2] > -0.02);
      if (ok) prev ? ctx.lineTo(P.x, P.y) : ctx.moveTo(P.x, P.y);
      prev = ok;
    }
    ctx.stroke(); ctx.restore();
  }
  // Sternbilder
  if (S.showConst && starFade > 0.05) {
    ctx.strokeStyle = `rgba(150,190,255,${0.5 * starFade})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const id in CONST.lines) for (const seg of CONST.lines[id]) {
      let prev = null;
      for (const [ra, dec] of seg) {
        const v = eqToEnu(ra * DEG, Math.sin(dec * DEG), Math.cos(dec * DEG), tmpV);
        const ok = project(v, P) && P.z > -0.3;
        if (ok && prev) { ctx.moveTo(prev.x, prev.y); ctx.lineTo(P.x, P.y); }
        prev = ok ? { x: P.x, y: P.y } : null;
      }
    }
    ctx.stroke();
  }
  // Sterne
  ctx.globalCompositeOperation = "lighter";
  const tw = performance.now() / 1000;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.vis = false;
    if (s.mag > magLimit) continue;
    eqToEnu(s.ra, s.sd, s.cd, tmpV);
    if (S.atmo && tmpV[2] < 0) continue;
    if (!project(tmpV, P) || P.x < -8 || P.y < -8 || P.x > W + 8 || P.y > H + 8) continue;
    // Helligkeit → Größe und Deckkraft; Funkeln nur in Horizontnähe, wie echt
    const b = Math.max(0, (magLimit + 0.5 - s.mag) / (magLimit + 2));
    let r = 1.1 + Math.pow(b, 1.4) * 4.2 * Math.min(1.6, Math.sqrt(70 * DEG / S.fov));
    let a = Math.min(1, 0.42 + b * 1.1) * starFade;
    if (S.atmo && tmpV[2] < 0.35) a *= 0.75 + 0.25 * Math.sin(tw * 3 + i);
    if (a < 0.02) continue;
    s.vis = true; s.x = P.x; s.y = P.y; s.r = r;
    const [cr, cg, cb] = s.col;
    if (r > 1.5) {
      ctx.globalAlpha = a * 0.7;
      const g = r * 3.4;
      ctx.drawImage(tinted(cr, cg, cb), P.x - g, P.y - g, g * 2, g * 2);
    }
    if (s.mag < 1.6) {
      // Funkeln: Strahlen werden langsam länger/kürzer
      const sp = r * (5.5 + 1.5 * Math.sin(tw * 1.7 + i * 0.7)) * Math.min(1.4, (2.2 - s.mag) / 2);
      ctx.globalAlpha = a * 0.55;
      ctx.drawImage(spikeSprite, P.x - sp, P.y - sp, sp * 2, sp * 2);
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
    ctx.beginPath(); ctx.arc(P.x, P.y, Math.max(0.65, r * 0.5), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  // Planeten, Mond, Sonne
  for (const b of bodies) {
    b.sx = null;
    if (S.atmo && b.v[2] < -0.01) continue;
    if (!project(b.v, P)) continue;
    if (P.x < -60 || P.y < -60 || P.x > W + 60 || P.y > H + 60) continue;
    b.sx = P.x; b.sy = P.y;
    const pxPerDeg = cam.scale * 2 / (1 + P.z) * DEG;
    if (b.id === "sun") {
      const r = Math.max(9, b.radiusDeg * pxPerDeg);
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.9; ctx.drawImage(tinted(255, 236, 200), P.x - r * 6, P.y - r * 6, r * 12, r * 12);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#fffaf0"; ctx.beginPath(); ctx.arc(P.x, P.y, r, 0, 6.2832); ctx.fill();
      b.pr = r;
    } else if (b.id === "moon") {
      const r = Math.max(8, b.radiusDeg * pxPerDeg);
      drawMoon(P.x, P.y, r, b, sun);
      b.pr = r;
    } else {
      const r = b.mag < -1 ? 3.6 : b.mag < 1 ? 2.8 : b.mag < 6 ? 2 : 1.5;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = Math.max(0.3, starFade);
      const c = hexRgb(b.color);
      ctx.drawImage(tinted(c[0], c[1], c[2]), P.x - r * 4, P.y - r * 4, r * 8, r * 8);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(P.x, P.y, r, 0, 6.2832); ctx.fill();
      b.pr = r;
    }
  }

  // Boden mit Horizontlinie
  if (S.atmo) drawGround(day);
  else drawHorizonLine();

  // Beschriftungen
  const rects = [];
  const free = (x, y, w, h) => { for (const q of rects) if (x < q[2] && x + w > q[0] && y < q[3] && y + h > q[1]) return false; rects.push([x, y, x + w, y + h]); return true; };
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // Himmelsrichtungen
  ctx.font = "600 13px " + cssVar("--font-display");
  for (let k = 0; k < 16; k += (S.fov > 60 * DEG ? 2 : 1)) {
    const p = projectAltAz(k * 22.5 * DEG, 0);
    if (!p) continue;
    ctx.fillStyle = k % 4 === 0 ? "#ff5a4d" : "rgba(233,237,246,0.7)";
    ctx.fillText(DIRS[k], p.x, p.y - 12);
  }
  for (const b of bodies) {
    if (b.sx == null) continue;
    ctx.font = "500 13px " + cssVar("--font-sans");
    const label = b.name;
    const w = ctx.measureText(label).width;
    const y = b.sy + b.pr + 11;
    if (free(b.sx - w / 2, y - 7, w, 14)) { ctx.fillStyle = b.id === S.sel?.id ? "#ff5a4d" : b.kind === tr("planet") ? "#ff9f86" : "#f3eedf"; ctx.fillText(label, b.sx, y); }
  }
  if (S.showNames && starFade > 0.15) {
    const lim = S.fov > 100 * DEG ? 2.2 : S.fov > 65 * DEG ? 3.3 : S.fov > 40 * DEG ? 4.0 : 6;
    for (const n of STAR_NAMES) {
      if (n.mag > lim) continue;
      const v = eqToEnu(n.ra * DEG, Math.sin(n.dec * DEG), Math.cos(n.dec * DEG), tmpV);
      if (S.atmo && v[2] < 0) continue;
      if (!project(v, P) || P.x < 0 || P.x > W || P.y < 0 || P.y > H) continue;
      const label = n.n[LANG] || n.n.en;
      const bright = n.mag < 1.5;
      ctx.font = (bright ? "500 13px " : "400 12px ") + cssVar("--font-sans");
      const w = ctx.measureText(label).width;
      if (!free(P.x + 7, P.y - 8, w, 16)) continue;
      const al = n.mag < 1.5 ? 0.95 : n.mag < 2.5 ? 0.78 : 0.55;
      ctx.textAlign = "left"; ctx.fillStyle = `rgba(240,242,255,${al * starFade})`;
      ctx.shadowColor = "rgba(0,0,30,0.8)"; ctx.shadowBlur = 4;
      ctx.fillText(label, P.x + 8, P.y + 1);
      ctx.shadowBlur = 0; ctx.textAlign = "center";
    }
  }
  if (S.showConst && starFade > 0.15) {
    ctx.font = "500 12px " + cssVar("--font-sans");
    for (const id in CONST.names) {
      const c = CONST.names[id];
      if (S.fov > 80 * DEG && c.rank > 2) continue;
      const v = eqToEnu(c.ra * DEG, Math.sin(c.dec * DEG), Math.cos(c.dec * DEG), tmpV);
      if (S.atmo && v[2] < 0.03) continue;
      if (!project(v, P) || P.x < 0 || P.x > W || P.y < 0 || P.y > H) continue;
      const label = (c.n[LANG] || c.n.la).toUpperCase();
      const w = ctx.measureText(label).width + 8;
      if (!free(P.x - w / 2, P.y - 7, w, 14)) continue;
      ctx.fillStyle = `rgba(200,215,255,${0.7 * starFade})`;
      ctx.letterSpacing = "1.5px";
      ctx.fillText(label, P.x, P.y);
      ctx.letterSpacing = "0px";
    }
  }
  // Auswahl-Ring
  if (S.sel) {
    const p = selScreen();
    if (p) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
      ctx.strokeStyle = `rgba(255,90,77,${0.6 + 0.4 * pulse})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8 + pulse * 2, 0, 6.2832); ctx.stroke();
    }
  }
  updateHud(jd, sunAlt);
}

function drawMoon(x, y, r, moon, sun) {
  // Phase aus dem Winkel Sonne–Mond; beleuchtete Seite zeigt zur Sonne
  const cosE = Math.sin(moon.dec) * Math.sin(sun.dec) + Math.cos(moon.dec) * Math.cos(sun.dec) * Math.cos(moon.ra - sun.ra);
  const elong = Math.acos(Math.max(-1, Math.min(1, cosE)));
  moon.illum = (1 - Math.cos(elong)) / 2;
  let ang = 0;
  if (project(sun.v, P)) ang = Math.atan2(P.y - y, P.x - x);
  else { const sv = sun.v; ang = Math.atan2(-(sv[0] * cam.u[0] + sv[1] * cam.u[1] + sv[2] * cam.u[2]), sv[0] * cam.r[0] + sv[1] * cam.r[1]); }
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.35;
  ctx.drawImage(tinted(230, 230, 220), -r * 4, -r * 4, r * 8, r * 8);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(40,42,50,0.9)"; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
  // beleuchteter Teil: Halbkreis zur Sonne + Ellipse des Terminators
  const k = Math.cos(elong); // 1 = Neumond, -1 = Vollmond
  ctx.fillStyle = "#ece8dc"; ctx.beginPath();
  ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
  ctx.ellipse(0, 0, Math.abs(k) * r, r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
  ctx.fill();
  // Mare (dunkle Ebenen), grob nach der echten Mondvorderseite angeordnet
  if (r > 14) {
    ctx.clip();
    ctx.rotate(-ang);
    ctx.fillStyle = "rgba(120,118,112,0.45)";
    for (const [mx, my, mr] of [[-0.35, -0.35, 0.28], [0.05, -0.45, 0.2], [0.3, -0.2, 0.22], [0.42, 0.1, 0.16], [-0.1, 0.05, 0.18], [-0.45, 0.15, 0.22], [0.15, 0.35, 0.12], [-0.25, -0.05, 0.12]]) {
      ctx.beginPath(); ctx.arc(mx * r, my * r, mr * r, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

function drawGround(day) {
  // Horizontkreis abtasten; der Boden ist die Seite, auf der der Nadir liegt
  const pts = [];
  for (let a = 0; a <= 360; a += 2) {
    const v = enu(a * DEG, 0);
    const z = v[0] * cam.f[0] + v[1] * cam.f[1] + v[2] * cam.f[2];
    const k = 2 / Math.max(1e-4, 1 + z) * cam.scale;
    let x = cam.cx + (v[0] * cam.r[0] + v[1] * cam.r[1]) * k;
    let y = cam.cy - (v[0] * cam.u[0] + v[1] * cam.u[1] + v[2] * cam.u[2]) * k;
    x = Math.max(-1e5, Math.min(1e5, x)); y = Math.max(-1e5, Math.min(1e5, y));
    pts.push([x, y]);
  }
  const nad = [0, 0, -1];
  const zN = -cam.f[2];
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  let nadirInside = true;
  if (zN > -0.999) {
    const k = 2 / (1 + zN) * cam.scale;
    const nx = cam.cx + (nad[0] * cam.r[0] + nad[1] * cam.r[1]) * k;
    const ny = cam.cy - (nad[2] * cam.u[2]) * k;
    nadirInside = ctx.isPointInPath(nx * DPR, ny * DPR);
  } else nadirInside = false;
  if (!nadirInside) ctx.rect(-2e5, -2e5, 4e5, 4e5);
  // Wasserfläche (wie ein ruhiger See bis zum Horizont)
  if (!glSky) { ctx.fillStyle = rgb(mix([16, 22, 74], [70, 110, 165], day)); ctx.fill("evenodd"); }
  ctx.save();
  ctx.clip("evenodd");
  drawReflections(day);
  ctx.restore();
  // ferne Hügel als dunkle Silhouette knapp über dem Horizont (Vierecke je 1°)
  ctx.beginPath();
  const hillH = (a) => (0.32 + 0.3 * Math.sin(a * 0.11) * Math.sin(a * 0.037 + 1) + 0.15 * Math.sin(a * 0.53)) * DEG;
  const q = (az, alt) => (project(enu(az * DEG, alt), P) && P.z > -0.15 ? [P.x, P.y] : null);
  let pa = q(0, 0), pb = q(0, hillH(0));
  for (let a = 1; a <= 360; a++) {
    const ca = q(a, 0), cb = q(a, hillH(a));
    if (pa && pb && ca && cb && Math.abs(ca[0] - pa[0]) < W) {
      ctx.moveTo(pa[0], pa[1]); ctx.lineTo(ca[0], ca[1] + 0.5); ctx.lineTo(cb[0], cb[1]); ctx.lineTo(pb[0], pb[1]); ctx.closePath();
    }
    pa = ca; pb = cb;
  }
  ctx.fillStyle = rgb(mix([3, 4, 16], [30, 44, 40], day)); ctx.fill();
  // feiner Lichtsaum am Horizont
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = `rgba(120,140,230,${0.25 + day * 0.3})`; ctx.lineWidth = 1; ctx.stroke();
}
// Spiegelung im Wasser: Sterne, Milchstraße, Mond und Planeten an der
// Horizontebene gespiegelt, mit leichten Wellen
function drawReflections(day) {
  const fade = Math.pow(1 - day, 2);
  const t = performance.now() / 1000;
  const mv = [0, 0, 0];
  ctx.globalCompositeOperation = "lighter";
  if (fade > 0.05) {
    if (S.showMW && !glSky) drawMilkyWay(true, fade * 0.5);
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < stars.length; i++) {

  for (const c of list.slice(0, 20)) locRes.appendChild(cityButton(c[0], c[3], c[1], c[2], c[4], c[3]));
  if (!q) locNote.textContent = tr("placesHint", { n: CITIES.length });
  return list.length;
}
let geoTimer = 0, geoSeq = 0;
locQ.oninput = () => {
  const n = showCities(locQ.value);
  clearTimeout(geoTimer);
  const q = locQ.value.trim();
  if (q.length < 3) return;
  // Weltweite Ortssuche (Open-Meteo, ohne Anmeldung) für Orte, die nicht in der Liste stehen
  const seq = ++geoSeq;
  geoTimer = setTimeout(async () => {
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=${LANG}&format=json`);
      if (!r.ok || seq !== geoSeq) return;
      const data = await r.json();
      if (seq !== geoSeq) return;
      const have = new Set([...locRes.querySelectorAll("b")].map((b) => norm(b.textContent)));
      let added = 0;
      for (const g of data.results || []) {
        if (have.has(norm(g.name)) && !g.admin1) continue;
        const sub = [g.admin1, g.country].filter(Boolean).join(", ");
        locRes.appendChild(cityButton(g.name, sub, g.latitude, g.longitude, g.timezone, g.country));
        added++;
      }
      if (!n && !added) locNote.textContent = tr("noPlace");
    } catch {
      if (!n) locNote.textContent = tr("worldOffline");
    }
  }, 350);
  if (!n) locNote.textContent = tr("searchingWorld");
};
document.getElementById("tLoc").onclick = () => {
  if (!navigator.geolocation) { locNote.textContent = tr("noGeo"); return; }
  locNote.textContent = tr("locating");
  navigator.geolocation.getCurrentPosition((p) => {
    setLocation(tr("myPlace"), p.coords.latitude, p.coords.longitude, Intl.DateTimeFormat().resolvedOptions().timeZone);
    document.getElementById("tLoc").setAttribute("aria-pressed", "true"); openSheet(null);
  }, () => { locNote.textContent = tr("geoDenied"); }, { timeout: 10000 });
};

// Handy hochhalten: Kompass + Lagesensor steuern die Blickrichtung
let sensorAz = null, sensorAlt = null;
function onOrient(e) {
  let alpha = e.alpha;
  if (typeof e.webkitCompassHeading === "number") alpha = 360 - e.webkitCompassHeading;
  if (alpha == null || e.beta == null || e.gamma == null) return;
  const a = alpha * DEG, b = e.beta * DEG, g = e.gamma * DEG;
  // Rückseite des Handys (Kamera-Richtung) im Ost-Nord-Oben-System
  const E = -Math.sin(g) * Math.cos(a) - Math.cos(g) * Math.sin(b) * Math.sin(a);
  const N = -Math.sin(g) * Math.sin(a) + Math.cos(g) * Math.sin(b) * Math.cos(a);
  const U = -Math.cos(g) * Math.cos(b);
  sensorAz = Math.atan2(E, N); sensorAlt = Math.asin(Math.max(-1, Math.min(1, U)));
}
document.getElementById("tSensor").onclick = async () => {
  const btn = document.getElementById("tSensor"), msg = document.getElementById("sensorMsg");
  if (S.sensor) { S.sensor = false; btn.setAttribute("aria-pressed", "false"); window.removeEventListener("deviceorientationabsolute", onOrient); window.removeEventListener("deviceorientation", onOrient); msg.hidden = true; return; }
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== "granted") throw new Error("denied");
    }
  } catch { msg.hidden = false; msg.textContent = tr("sensorDenied"); return; }
  sensorAz = null;
  window.addEventListener("deviceorientationabsolute", onOrient);
  window.addEventListener("deviceorientation", onOrient);
  S.sensor = true; btn.setAttribute("aria-pressed", "true");
  msg.hidden = false; msg.textContent = tr("holdUp");
  setTimeout(() => { if (S.sensor && sensorAz === null) msg.textContent = tr("noSensor"); else if (S.sensor) msg.hidden = true; }, 1500);
};

// ---------------- Knöpfe in den Ecken + Suche ----------------
const sheets = { timeBtn: "timeSheet", menuBtn: "menuSheet", searchBtn: "searchSheet", pill: "locSheet" };
function openSheet(btnId) {
  for (const [b, sh] of Object.entries(sheets)) {
    const open = b === btnId && document.getElementById(sh).hidden;
    if (open) { S.sel = null; document.getElementById("info").hidden = true; }
    document.getElementById(sh).hidden = !open;
    document.getElementById(b).setAttribute("aria-pressed", String(open));
    if (open && b === "searchBtn") setTimeout(() => document.getElementById("q").focus(), 30);
    if (open && b === "pill") { setTimeout(() => document.getElementById("locQ").focus(), 30); showCities(""); }
  }
}
for (const b of Object.keys(sheets)) document.getElementById(b).onclick = () => openSheet(b);
canvas.addEventListener("pointerdown", () => { for (const b of Object.keys(sheets)) if (b !== "timeBtn") { document.getElementById(sheets[b]).hidden = true; document.getElementById(b).setAttribute("aria-pressed", "false"); } });

const norm = (t) => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function searchIndex() {
  const out = [];
  for (const b of bodies) out.push({ label: b.name, kind: b.kind, hit: { type: "body", id: b.id } });
  for (const n of STAR_NAMES) {
    const name = n.n[LANG] || n.n.en;
    const cat = stars.find((x) => Math.abs(x.ra - n.ra * DEG) < 0.004 && Math.abs(Math.asin(x.sd) - n.dec * DEG) < 0.004);
    out.push({ label: name, alt: n.n.en, kind: tr("star"), hit: { type: "star", ra: n.ra * DEG, dec: n.dec * DEG, mag: n.mag, bv: cat ? cat.bv : null, key: n.n.en, name, kind: tr("star"), con: nearestConstellation(n.ra * DEG, n.dec * DEG) } });
  }
  for (const id in CONST.names) {
    const c = CONST.names[id];
    out.push({ label: c.n[LANG] || c.n.la, alt: c.n.la + " " + c.n.en, kind: tr("constellation"), hit: { type: "const", ra: c.ra * DEG, dec: c.dec * DEG, name: c.n[LANG] || c.n.la } });
  }
  return out;
}
const qEl = document.getElementById("q"), resEl = document.getElementById("results");
qEl.oninput = () => {
  const q = norm(qEl.value.trim());
  resEl.innerHTML = "";
  if (!q) return;
  const list = searchIndex().filter((x) => norm(x.label).includes(q) || (x.alt && norm(x.alt).includes(q))).sort((a, b) => norm(a.label).indexOf(q) - norm(b.label).indexOf(q)).slice(0, 12);
  for (const it of list) {
    const li = document.createElement("li"), bt = document.createElement("button");
    bt.innerHTML = "<b></b><span></span>"; bt.firstChild.textContent = it.label; bt.lastChild.textContent = it.kind;
    bt.onclick = () => {
      openSheet(null); qEl.value = ""; resEl.innerHTML = "";
      const h = it.hit;
      if (h.type === "const") { zoomTo({ type: "star", ra: h.ra, dec: h.dec, wide: true }); return; }
      S.sel = h; document.getElementById("info").hidden = false; fillInfo(); zoomTo(h);
    };
    li.appendChild(bt); resEl.appendChild(li);
  }
};

// ---------------- Schleife ----------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(60, now - last); last = now;
  if (anim) {
    const t = Math.min(1, (now - anim.t0) / 900), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    S.az = anim.az0 + (anim.az1 - anim.az0) * e; S.alt = anim.alt0 + (anim.alt1 - anim.alt0) * e;
    S.fov = Math.exp(Math.log(anim.fov0) + (Math.log(anim.fov1) - Math.log(anim.fov0)) * e);
    if (t >= 1) anim = null;
  } else if (S.sensor && sensorAz !== null) {
    S.az += wrap(sensorAz - S.az) * 0.15; S.alt += (sensorAlt - S.alt) * 0.15; clampAlt();
  } else if (!drag && (Math.abs(vel.az) > 1e-6 || Math.abs(vel.alt) > 1e-6)) {
    S.az += vel.az * dt; S.alt += vel.alt * dt; clampAlt();
    const k = Math.exp(-dt / 350); vel.az *= k; vel.alt *= k;
  }
  if (keys.size) {
    const r = 0.0009 * dt * (S.fov / (70 * DEG));
    if (keys.has("ArrowLeft")) S.az -= r; if (keys.has("ArrowRight")) S.az += r;
    if (keys.has("ArrowUp")) S.alt += r; if (keys.has("ArrowDown")) S.alt -= r;
    if (keys.has("+") || keys.has("=")) S.fov *= Math.exp(-0.002 * dt); if (keys.has("-")) S.fov *= Math.exp(0.002 * dt);
    S.fov = Math.max(4 * DEG, Math.min(150 * DEG, S.fov)); clampAlt();
  }
  S.az = (S.az + 2 * Math.PI) % (2 * Math.PI);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
