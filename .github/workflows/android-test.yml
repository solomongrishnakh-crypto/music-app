name: Android-App im Emulator testen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Offline-Dateiliste erzeugen
        run: |
          mkdir -p android/app/src/main/assets
          python3 scripts/offline-list.py > android/app/src/main/assets/offline_sky.txt
      - name: Test-APK bauen
        run: gradle -p android assembleDebug --no-daemon -Pvc=9999
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten und testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: sh scripts/emu-test.sh
      - name: Ergebnisse bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emulator-Ergebnis
          path: emu-out/
          retention-days: 14
      - name: Ergebnisse in eigenen Zweig legen (zum Ansehen)
        if: always()
        run: |
          cd emu-out
          git init -q -b emu-results
          git config user.name "emulator-test"
          git config user.email "emulator-test@users.noreply.github.com"
          git add -A
          git commit -q -m "Emulator-Ergebnis Lauf ${{ github.run_number }} [skip ci] [vercel skip]"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emu-results
