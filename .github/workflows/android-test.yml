name: Android-App im Emulator testen

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Offline-Dateiliste erzeugen
        run: |
          mkdir -p android/app/src/main/assets
          python3 scripts/offline-list.py > android/app/src/main/assets/offline_sky.txt
      - name: Test-APK bauen
        run: gradle -p android assembleDebug --no-daemon -Pvc=${{ github.run_number }}
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten und testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: sh scripts/emu-test.sh
      - name: Ergebnisse bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emulator-Ergebnis
          path: emu-out/
          retention-days: 14
