name: Android-App bauen

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Offline-Dateiliste erzeugen
        run: |
          mkdir -p android/app/src/main/assets
          python3 scripts/offline-list.py > android/app/src/main/assets/offline_sky.txt
          wc -l android/app/src/main/assets/offline_sky.txt
      - name: Test-APK bauen
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          CEN_KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CEN_KS="$RUNNER_TEMP/release.jks"
            echo "Signatur: privater Schluessel"
          else
            echo "Signatur: alter Test-Schluessel"
          fi
          if ! gradle -p android assembleWebDebug --no-daemon -Pvc=${{ github.run_number }} > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E '^e: |error:|What went wrong|Caused by|Could not|Unsupported|requires' -A3 "$RUNNER_TEMP/build.log" | head -45 | while read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi
      - name: APK bereitstellen (nur mit GitHub-Login herunterladbar)
        uses: actions/upload-artifact@v4
        with:
          name: Centaurian-App
          path: android/app/build/outputs/apk/web/debug/app-web-debug.apk
          retention-days: 30
      - name: Update fuer die App veroeffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/web/debug/app-web-debug.apk out/Centaurian.apk
          SHA=$(sha256sum out/Centaurian.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s out/Centaurian.apk)
          echo "{\"code\": ${{ github.run_number }}, \"name\": \"2.${{ github.run_number }}\", \"sha256\": \"$SHA\", \"size\": $SIZE}" > out/version.json
          cat out/version.json
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "App-Update" --notes "Automatische Updates fuer die Centaurian-App" --latest=false
          # Download-Zaehler: Anzahl der Webseiten-Downloads bleibt ueber neue Versionen erhalten
          OLD=$(gh api repos/${{ github.repository }}/releases/tags/app-latest --jq '[.assets[]|select(.name=="Centaurian-web.apk")|.download_count]|add // 0' 2>/dev/null || echo 0)
          BODY=$(gh api repos/${{ github.repository }}/releases/tags/app-latest --jq '.body' 2>/dev/null || echo "")
          PREV=$(echo "$BODY" | grep -oE 'web-downloads: [0-9]+' | grep -oE '[0-9]+' | head -1)
          TOTAL=$(( ${PREV:-0} + ${OLD:-0} ))
          gh release edit app-latest --notes "$(printf 'Automatische Updates fuer die Centaurian-App\nweb-downloads: %s' "$TOTAL")" || true
          cp out/Centaurian.apk out/Centaurian-web.apk
          gh release upload app-latest out/Centaurian.apk out/Centaurian-web.apk out/version.json --clobber

      - name: Play-Store-Bundle bauen (AAB, signiert mit Upload-Schluessel)
        continue-on-error: true
        env:
          PLAY_KS_B64: ${{ secrets.PLAY_KS_B64 }}
          CEN_UPLOAD_KS_PW: ${{ secrets.PLAY_KS_PW }}
        run: |
          if [ -z "$PLAY_KS_B64" ] || [ -z "$CEN_UPLOAD_KS_PW" ]; then
            echo "::error::Secrets PLAY_KS_B64 und PLAY_KS_PW fehlen. Ohne Upload-Schluessel wird kein AAB gebaut."
            exit 1
          fi
          echo "$PLAY_KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export CEN_UPLOAD_KS="$RUNNER_TEMP/upload.jks"
          gradle -p android bundlePlayRelease --no-daemon -Pvc=${{ github.run_number }}
          # Pruefen, dass das Bundle wirklich signiert ist
          jarsigner -verify android/app/build/outputs/bundle/playRelease/*.aab | head -3
      - name: AAB bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Centaurian-Play-AAB
          path: android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: warn
          retention-days: 30
      - name: AAB zusaetzlich im Release bereitstellen (zum Herunterladen ohne Login)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(ls android/app/build/outputs/bundle/playRelease/*.aab | head -1)
          cp "$F" out/Centaurian-play.aab
          gh release upload app-latest out/Centaurian-play.aab --clobber
