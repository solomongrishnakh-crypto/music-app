name: Android-App bauen

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Debug-APK bauen
        run: gradle -p android assembleDebug --no-daemon
      - name: APK als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Centaurian-test.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test Centaurian-test.apk --prerelease --title "Centaurian Android (Test)" --notes "Test-APK, automatisch gebaut."
