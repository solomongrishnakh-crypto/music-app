name: Android-App bauen

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Offline-Dateiliste erzeugen
        run: |
          mkdir -p android/app/src/main/assets
          python3 scripts/offline-list.py > android/app/src/main/assets/offline_sky.txt
          wc -l android/app/src/main/assets/offline_sky.txt
      - name: Test-APK bauen
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          CEN_KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CEN_KS="$RUNNER_TEMP/release.jks"
            echo "Signatur: privater Schluessel"
          else
            echo "Signatur: alter Test-Schluessel"
          fi
          gradle -p android assembleDebug --no-daemon -Pvc=${{ github.run_number }}
      - name: APK bereitstellen (nur mit GitHub-Login herunterladbar)
        uses: actions/upload-artifact@v4
        with:
          name: Centaurian-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Update fuer die App veroeffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Centaurian.apk
          SHA=$(sha256sum out/Centaurian.apk | cut -d' ' -f1)
          echo "{\"code\": ${{ github.run_number }}, \"name\": \"2.${{ github.run_number }}\", \"sha256\": \"$SHA\"}" > out/version.json
          cat out/version.json
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "App-Update" --notes "Automatische Updates fuer die Centaurian-App" --latest=false
          gh release upload app-latest out/Centaurian.apk out/version.json --clobber
