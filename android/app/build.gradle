plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'space.centaurian.app'
    compileSdk 35

    defaultConfig {
        applicationId 'space.centaurian.app'
        minSdk 24
        targetSdk 35
        def vc = (project.findProperty('vc') ?: '2').toInteger()
        versionCode vc
        versionName "2.${vc}"
    }

    // Zwei Varianten: "web" = APK von der Webseite (mit Selbst-Update),
    // "play" = Play Store (ohne Selbst-Update, ohne Install-Berechtigung).
    flavorDimensions 'dist'
    productFlavors {
        web {
            dimension 'dist'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
        }
        play {
            dimension 'dist'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
        }
    }

    // Signatur: im CI mit privatem Schluessel aus den GitHub-Secrets (CEN_KS / CEN_KS_PW),
    // lokal faellt sie auf den alten Test-Schluessel zurueck.
    signingConfigs {
        debug {
            def ks = System.getenv('CEN_KS')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('CEN_KS_PW')
                keyAlias 'centaurian'
                keyPassword System.getenv('CEN_KS_PW')
            } else {
                storeFile file('../debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    // Release (Play Store): Upload-Schluessel kommt nur aus GitHub-Secrets (CEN_UPLOAD_KS / CEN_UPLOAD_KS_PW),
    // nie aus dem Repo. Ohne Schluessel entsteht ein unsigniertes Bundle (das der Store ablehnt).
    signingConfigs {
        release {
            def uks = System.getenv('CEN_UPLOAD_KS')
            if (uks) {
                storeFile file(uks)
                storePassword System.getenv('CEN_UPLOAD_KS_PW')
                keyAlias 'upload'
                keyPassword System.getenv('CEN_UPLOAD_KS_PW')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CEN_UPLOAD_KS')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
}
